# ThreatLens AI — Render Blueprint (Infrastructure as Code)
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: threatlens-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: threatlens-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "none"
      - key: CORS_ORIGINS
        sync: false # Set to your Vercel frontend URL, e.g. https://threatlens.vercel.app
      - key: VIRUSTOTAL_API_KEY
        sync: false # Set your VirusTotal API key (optional)
      - key: OTX_API_KEY
        sync: false # Set your AlienVault OTX API key (optional)
      - key: ADMIN_INITIAL_USERNAME
        value: admin
      - key: ADMIN_INITIAL_EMAIL
        value: admin@threatlens.ai
      - key: ADMIN_INITIAL_PASSWORD
        sync: false # Set custom bootstrap admin password or leave unset for default

databases:
  - name: threatlens-db
    databaseName: threatlens
    user: threatlens_user
    plan: free
    region: oregon
